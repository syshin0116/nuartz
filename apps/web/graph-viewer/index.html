<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nuartz spatial graph</title>
  <style>
    html,body,#graph { margin:0; width:100%; height:100%; overflow:hidden; background:#0b1220; color:#e2e8f0; font:13px system-ui,sans-serif; }
    #label { position:fixed; top:12px; left:12px; max-width:70%; padding:6px 10px; border-radius:8px; background:#0b1220cc; pointer-events:none; z-index:2; }
    #label:empty { display:none; }
    #error { position:fixed; inset:0; display:grid; place-content:center; padding:24px; text-align:center; background:#0b1220; z-index:10; }
    #error[hidden] { display:none; }
    a-scene { width:100%; height:100%; }
    body[data-mode="ar"], body[data-mode="ar"] #graph { background:transparent; }
  </style>
</head>
<body><div id="graph"></div><div id="label" role="status"></div><p id="error" role="alert" hidden></p><script type="module" src="./index.js"></script></body>
</html>
